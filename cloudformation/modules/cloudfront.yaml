AWSTemplateFormatVersion: '2010-09-09'

Description: CloudFront HTTPS distribution with an HTTP origin on the SparrowX ALB.

Parameters:

  EnvironmentName:
    Type: String
    Description: Deployment environment. Must be either dev or prod.
    AllowedValues:
      - dev
      - prod

  ProjectName:
    Type: String
    Description: Project name used for resource naming.
    Default: sparrowx

  DomainName:
    Type: String
    Default: ''
    Description: Optional custom hostname, for example app.example.com.

  CloudFrontCertificateArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Path for SSM parameter containing the ACM certificate ARN in us-east-1.

Conditions:

  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:

# ==============================================================
# Cloudfront Distribution
# ==============================================================

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} ${EnvironmentName} CloudFront distribution'
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If
          - HasCustomDomain
          - - !Ref DomainName
          - !Ref AWS::NoValue
        Origins:
          - Id: AlbHttpOrigin
            DomainName:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AlbDnsName'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: AlbHttpOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-cloudfront-distribution'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  DistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref Distribution
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-CloudFrontDistributionId'

  DistributionDomainName:
    Description: CloudFront hostname for the manual DNS record.
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-CloudFrontDomainName'
