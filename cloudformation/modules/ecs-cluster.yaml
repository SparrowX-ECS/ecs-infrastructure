AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Fargate cluster for the SparrowX application.

Parameters:

  EnvironmentName:
    Type: String
    Description: Deployment environment. Must be either dev or prod.
    AllowedValues:
      - dev
      - prod

  ProjectName:
    Type: String
    Description: Project name used for resource naming.
    Default: sparrowx

Resources:

# ============================================================
# Shared ECS task security group
# ============================================================

  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow private communication between ECS services.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'
      SecurityGroupEgress:
        - Description: Allow ECS task egress.
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-ecs-services-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  EcsServiceSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 1
      ToPort: 65535
      SourceSecurityGroupId: !Ref EcsServiceSecurityGroup
      Description: Allow TCP communication between ECS services.

# ============================================================
# ECS Cluster
# ============================================================

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${EnvironmentName}-cluster'

      ServiceConnectDefaults:
        Namespace: !GetAtt ServiceDiscoveryNamespace.Arn

      ClusterSettings:
        - Name: containerInsights
          Value: enabled

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-cluster'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}.local'
      Vpc:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'
      Description: !Sub 'Private ECS service discovery namespace for ${ProjectName}-${EnvironmentName}.'


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  EcsClusterName:
    Description: Name of the ECS cluster.
    Value: !Ref EcsCluster
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-EcsClusterName'

  EcsClusterArn:
    Description: ARN of the ECS cluster.
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-EcsClusterArn'

  EcsServiceSecurityGroupId:
    Description: Shared security group ID for ECS task-to-task traffic.
    Value: !Ref EcsServiceSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-EcsServiceSecurityGroupId'
