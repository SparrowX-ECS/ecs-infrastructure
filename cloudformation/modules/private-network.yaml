AWSTemplateFormatVersion: '2010-09-09'

Description: >
  SparrowX private networking for ECS.
  Creates three private subnets and private route tables
  across three Availability Zones, with optional NAT Gateways.

Parameters:

  EnvironmentName:
    Type: String
    Default: sparrowx
    Description: Environment name used for resource naming and tagging.

  ProjectName:
    Type: String
    Description: Project name used for resource naming.
    Default: sparrowx

  PrivateSubnetACidr:
    Type: String
    Description: CIDR block for the first private subnet.

  PrivateSubnetBCidr:
    Type: String
    Description: CIDR block for the second private subnet.

  PrivateSubnetCCidr:
    Type: String
    Description: CIDR block for the third private subnet.

  NatGWSubnetA:
    Type: String
    Default: disabled
    Description: Enable or disable the NAT Gateway in Availability Zone A.
    AllowedValues:
      - enabled
      - disabled

  NatGWSubnetB:
    Type: String
    Default: disabled
    Description: Enable or disable the NAT Gateway in Availability Zone B.
    AllowedValues:
      - enabled
      - disabled

  NatGWSubnetC:
    Type: String
    Default: disabled
    Description: Enable or disable the NAT Gateway in Availability Zone C.
    AllowedValues:
      - enabled
      - disabled

Conditions:

  NatGatewayAEnabled: !Equals [!Ref NatGWSubnetA, enabled]

  NatGatewayBEnabled: !Equals [!Ref NatGWSubnetB, enabled]

  NatGatewayCEnabled: !Equals [!Ref NatGWSubnetC, enabled]

Resources:

  # ============================================================
  # Private Subnets
  # ============================================================

  PrivateSubnetA:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnetACidr

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-a'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  PrivateSubnetB:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnetBCidr

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-b'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  PrivateSubnetC:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: !Ref PrivateSubnetCCidr

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-c'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


# ============================================================
  # Elastic IPs for NAT Gateways
  # ============================================================

  NatGatewayEIPA:
    Type: AWS::EC2::EIP
    Condition: NatGatewayAEnabled
    Properties:
      Domain: vpc

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-eip-a'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  NatGatewayEIPB:
    Type: AWS::EC2::EIP
    Condition: NatGatewayBEnabled
    Properties:
      Domain: vpc

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-eip-b'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  NatGatewayEIPC:
    Type: AWS::EC2::EIP
    Condition: NatGatewayCEnabled
    Properties:
      Domain: vpc

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-eip-c'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  # ============================================================
  # NAT Gateways
  # ============================================================

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Condition: NatGatewayAEnabled
    Properties:
      AllocationId: !GetAtt NatGatewayEIPA.AllocationId
      SubnetId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnetA'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-a'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatGatewayBEnabled
    Properties:
      AllocationId: !GetAtt NatGatewayEIPB.AllocationId
      SubnetId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnetB'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-b'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  NatGatewayC:
    Type: AWS::EC2::NatGateway
    Condition: NatGatewayCEnabled
    Properties:
      AllocationId: !GetAtt NatGatewayEIPC.AllocationId
      SubnetId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnetC'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-c'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName



  # ============================================================
  # Private Route Tables
  # ============================================================

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-rt-a'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-rt-b'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: 
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-rt-c'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName


  # ============================================================
  # Private Routes
  # ============================================================

  PrivateRouteA:
    Type: AWS::EC2::Route
    Condition: NatGatewayAEnabled
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA


  PrivateRouteB:
    Type: AWS::EC2::Route
    Condition: NatGatewayBEnabled
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB


  PrivateRouteC:
    Type: AWS::EC2::Route
    Condition: NatGatewayCEnabled
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayC


  # ============================================================
  # Private Subnet Associations
  # ============================================================

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      SubnetId: !Ref PrivateSubnetA


  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      SubnetId: !Ref PrivateSubnetB


  PrivateSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      SubnetId: !Ref PrivateSubnetC

  

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  PrivateSubnetA:
    Description: Private subnet in Availability Zone A
    Value: !Ref PrivateSubnetA

    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnetA'


  PrivateSubnetB:
    Description: Private subnet in Availability Zone B
    Value: !Ref PrivateSubnetB

    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnetB'


  PrivateSubnetC:
    Description: Private subnet in Availability Zone C
    Value: !Ref PrivateSubnetC

    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnetC'


  PrivateSubnets:
    Description: Comma-separated list of private subnet IDs
    Value: !Join
      - ','
      - - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
        - !Ref PrivateSubnetC
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnets'