AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Application Load Balancer for the SparrowX ECS application.

Parameters:

  EnvironmentName:
    Type: String
    Description: Deployment environment. Must be either dev or prod.
    AllowedValues:
      - dev
      - prod

  ProjectName:
    Type: String
    Description: Project name used for resource naming.
    Default: sparrowx

  Scheme:
    Type: String
    Default: internet-facing
    AllowedValues:
      - internet-facing
      - internal
    Description: Load balancer scheme.

Resources:

  # ============================================================
  # ALB Security Group
  # ============================================================

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP traffic to the application load balancer.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

      SecurityGroupIngress:

        - Description: Allow HTTP traffic from the internet.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - Description: Allow outbound traffic.
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-alb-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName


  # ============================================================
  # Application Load Balancer
  # ============================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-alb'

      Scheme: !Ref Scheme
      Type: application
      IpAddressType: ipv4

      SecurityGroups:
        - !Ref AlbSecurityGroup

      Subnets:
        - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnetA'
        - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnetB'
        - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnetC'

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-alb'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName


  # ============================================================
  # HTTP Listener
  # ============================================================

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer

      Port: 80
      Protocol: HTTP

      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: >
              Route not found.

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  LoadBalancerArn:
    Description: ARN of the Application Load Balancer.
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AlbArn'


  LoadBalancerDnsName:
    Description: DNS name of the Application Load Balancer.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AlbDnsName'


  LoadBalancerHostedZoneId:
    Description: Canonical hosted zone ID of the Application Load Balancer.
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AlbHostedZoneId'


  LoadBalancerSecurityGroupId:
    Description: Security group ID of the Application Load Balancer.
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AlbSecurityGroupId'


  HttpListenerArn:
    Description: ARN of the HTTP listener.
    Value: !Ref HttpListener
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AlbHttpListenerArn'
