AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Fargate cluster for the SparrowX application.

Parameters:

  EnvironmentName:
    Type: String
    Default: sparrowx
    Description: Environment name used for resource naming.

Resources:

  # ============================================================
  # Shared ECS task security group
  # ============================================================

  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow private communication between ECS services.
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      SecurityGroupEgress:
        - Description: Allow ECS task egress.
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecs-services-sg'
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsServiceSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref EcsServiceSecurityGroup
      Description: Allow Service Connect traffic between ECS tasks.

  # ============================================================
  # ECS Cluster
  # ============================================================

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'

      ServiceConnectDefaults:
        Namespace: !GetAtt ServiceDiscoveryNamespace.Arn

      ClusterSettings:
        - Name: containerInsights
          Value: enabled

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cluster'
        - Key: Environment
          Value: !Ref EnvironmentName

  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub '${EnvironmentName}.local'
      Vpc:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      Description: !Sub 'Private ECS service discovery namespace for ${EnvironmentName}.'


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  EcsClusterName:
    Description: Name of the ECS cluster.
    Value: !Ref EcsCluster
    Export:
      Name: !Sub '${EnvironmentName}-EcsClusterName'

  EcsClusterArn:
    Description: ARN of the ECS cluster.
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub '${EnvironmentName}-EcsClusterArn'

  EcsServiceSecurityGroupId:
    Description: Shared security group ID for ECS task-to-task traffic.
    Value: !Ref EcsServiceSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-EcsServiceSecurityGroupId'
