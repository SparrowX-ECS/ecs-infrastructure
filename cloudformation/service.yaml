AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Reusable ECS Fargate service template for SparrowX applications.

Transform:
  - AWS::LanguageExtensions

Parameters:

  # ============================================================
  # General
  # ============================================================

  EnvironmentName:
    Type: String
    Description: Deployment environment. Must be either dev or prod.
    AllowedValues:
      - dev
      - prod

  ProjectName:
    Type: String
    Description: Project name used for resource naming.
    Default: sparrowx

  ServiceName:
    Type: String
    Description: Name of the application service.

  ECRRepoName:
    Type: String
    Description: Name of the ECR repository.

  FrontendServiceName:
    Type: String
    Description: Name of the frontend service. Used for creating fallback rule to handle errors.
    Default: web-portal

  ImageTag:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{7,64}$'
    Description: Immutable Git commit SHA used as the Docker image tag.

  ContainerPort:
    Type: Number
    Default: 8000
    Description: Port exposed by the application container.

  Size:
    Type: String
    Default: small
    Description: Fargate task size. Must be one of micro, small, medium, large, or x-large.
    AllowedValues:
      - micro
      - small
      - medium
      - large
      - x-large

  DesiredCount:
    Type: Number
    Description: Desired number of ECS tasks.
    Default: 1
    MinValue: 1
    MaxValue: 10

  # ============================================================
  # ALB
  # ============================================================

  PathPattern:
    Type: String
    Description: ALB path pattern routed to this service.

  ListenerRulePriority:
    Type: Number
    Description: Unique ALB listener rule priority.

  HealthCheckPath:
    Type: String
    Default: /health
    Description: HTTP health check path.

  # ============================================================
  # Database
  # ============================================================

  DatabaseSecretArn:
    Type: String
    Default: ''
    Description: >
      ARN of the database secret. Leave empty for services
      without a database.

  DatabaseSecurityGroupId:
    Type: String
    Default: ''
    Description: >
      Database security group ID. Leave empty for services
      without a database.

  DatabaseHost:
    Type: String
    Default: ''
    Description: Database endpoint hostname for services with a database.

  DatabasePort:
    Type: String
    Default: '5432'
    Description: Database port for services with a database.

  DatabaseName:
    Type: String
    Default: ''
    Description: Database name for services with a database.

  # ============================================================
  # API URLs
  # ============================================================

  CustomerApiUrl:
    Type: String
    Default: ''
    Description: Optional Customer API base URL for reporting services.

  TaskApiUrl:
    Type: String
    Default: ''
    Description: Optional Task API base URL for reporting services.

  BillingApiUrl:
    Type: String
    Default: ''
    Description: Optional Billing API base URL for reporting services.

  CorsAllowOrigins:
    Type: String
    Default: '*'
    Description: Comma-separated browser origins allowed by the API.


  # ============================================================
  # Mappings
  # ============================================================

Mappings:

  FargateSizes:

    micro:
      Cpu: '256'
      Memory: '512'

    small:
      Cpu: '512'
      Memory: '1024'

    medium:
      Cpu: '1024'
      Memory: '2048'

    large:
      Cpu: '2048'
      Memory: '4096'

    x-large:
      Cpu: '4096'
      Memory: '8192'

Conditions:

  HasDatabase: !Not [!Equals [!Ref DatabaseSecretArn, '']]
  HasCustomerApiUrl: !Not [!Equals [!Ref CustomerApiUrl, '']]
  HasTaskApiUrl: !Not [!Equals [!Ref TaskApiUrl, '']]
  HasBillingApiUrl: !Not [!Equals [!Ref BillingApiUrl, '']]
  IsFrontendService: !Equals [!Ref ServiceName, !Ref FrontendServiceName]

# ==============================================================
# Resources
# ==============================================================

Resources:

  # ============================================================
  # ECS Task Security Group
  # ============================================================

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName}-${EnvironmentName} ${ServiceName} ECS tasks.'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

      SecurityGroupIngress:

        - Description: Allow traffic from the ALB.
          IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AlbSecurityGroupId'

      SecurityGroupEgress:

        - Description: Allow outbound traffic.
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-sg'
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # Allow ECS service to access its own database
  # ============================================================

  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasDatabase
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt ServiceSecurityGroup.GroupId


  # ============================================================
  # CloudWatch Logs
  # ============================================================

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/${EnvironmentName}/${ServiceName}'
      RetentionInDays: 3

      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName


  # ============================================================
  # ECS Task Execution Role
  # ============================================================

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'ECS execution role for ${ProjectName}-${EnvironmentName} ${ServiceName}.'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # Allow ECS execution role to read database secret
  # ============================================================

  DatabaseSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: HasDatabase
    Properties:
      PolicyName: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-database-secret-access'

      Roles:
        - !Ref TaskExecutionRole

      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecretArn


  # ============================================================
  # ECS Task Role
  # ============================================================

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Application task role for ${ProjectName}-${EnvironmentName} ${ServiceName}.'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # ECS Task Role Policies
  # ============================================================
  EcsExecPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-${EnvironmentName} ${ServiceName}-ecs-exec'
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'


  # ============================================================
  # ECS Task Definition
  # ============================================================

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:

      Family: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}'

      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      Cpu: !FindInMap
        - FargateSizes
        - !Ref Size
        - Cpu

      Memory: !FindInMap
        - FargateSizes
        - !Ref Size
        - Memory

      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn

      ContainerDefinitions:

        - Name: !Ref ServiceName

          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${EnvironmentName}-${ECRRepoName}:${ImageTag}'

          Essential: true

          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Name: http
              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

          Environment:

            - Name: SERVICE_NAME
              Value: !Ref ServiceName

            - Name: CORS_ALLOW_ORIGINS
              Value: !Ref CorsAllowOrigins

            - !If
              - HasCustomerApiUrl
              - Name: CUSTOMER_API_URL
                Value: !Ref CustomerApiUrl
              - !Ref AWS::NoValue

            - !If
              - HasTaskApiUrl
              - Name: TASK_API_URL
                Value: !Ref TaskApiUrl
              - !Ref AWS::NoValue

            - !If
              - HasBillingApiUrl
              - Name: BILLING_API_URL
                Value: !Ref BillingApiUrl
              - !Ref AWS::NoValue

            - !If
              - HasDatabase
              - Name: DB_HOST
                Value: !Ref DatabaseHost
              - !Ref AWS::NoValue

            - !If
              - HasDatabase
              - Name: DB_PORT
                Value: !Ref DatabasePort
              - !Ref AWS::NoValue

            - !If
              - HasDatabase
              - Name: DB_NAME
                Value: !Ref DatabaseName
              - !Ref AWS::NoValue

          Secrets:

            - !If
              - HasDatabase
              - Name: DB_USERNAME
                ValueFrom: !Sub '${DatabaseSecretArn}:username::'
              - !Ref AWS::NoValue

            - !If
              - HasDatabase
              - Name: DB_PASSWORD
                ValueFrom: !Sub '${DatabaseSecretArn}:password::'
              - !Ref AWS::NoValue

  # ============================================================
  # ALB Target Group
  # ============================================================

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:

      Name: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}'

      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

      TargetType: ip

      Protocol: HTTP
      Port: !Ref ContainerPort

      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

      Matcher:
        HttpCode: '200-399'

      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # ALB Listener Rule
  # ============================================================

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:

      ListenerArn:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AlbHttpListenerArn'

      Priority: !Ref ListenerRulePriority

      Conditions:

        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Ref PathPattern

      Actions:

        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ============================================================
  # ALB FallbackListener Rules
  # ============================================================

  # Handle API routes with a 404 response if no matching route is found.
  ApiFallbackRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AlbHttpListenerArn'

      Priority: 2200
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/*
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"detail":"API route not found"}'

  # Handle frontend routes with a 404 response if no matching route is found.
  FrontendRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsFrontendService
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AlbHttpListenerArn'

      Priority: 2300
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ============================================================
  # ECS Fargate Service
  # ============================================================

  EcsService:
    Type: AWS::ECS::Service

    DependsOn:
      - ListenerRule

    Properties:

      ServiceName: !Ref ServiceName

      EnableExecuteCommand: true

      Cluster:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-EcsClusterArn'

      LaunchType: FARGATE

      PlatformVersion: '1.4.0'

      DesiredCount: !Ref DesiredCount

      TaskDefinition: !Ref TaskDefinition

      ServiceConnectConfiguration:
        Enabled: true
        Services:
          - PortName: http
            DiscoveryName: !Ref ServiceName
            ClientAliases:
              - Port: !Ref ContainerPort
                DnsName: !Ref ServiceName

      HealthCheckGracePeriodSeconds: 60

      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED

          SecurityGroups:
            - !Ref ServiceSecurityGroup
            - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-EcsServiceSecurityGroupId'

          Subnets:

            - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnetA'

            - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnetB'

            - Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-PrivateSubnetC'

      LoadBalancers:

        - ContainerName: !Ref ServiceName
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
          
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  ServiceName:
    Description: ECS service name.
    Value: !Ref EcsService
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-EcsServiceName'


  TaskDefinitionArn:
    Description: ECS task definition ARN.
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-TaskDefinitionArn'


  TargetGroupArn:
    Description: ALB target group ARN.
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-TargetGroupArn'


  ServiceSecurityGroupId:
    Description: ECS service security group ID.
    Value: !Ref ServiceSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-SecurityGroupId'


  LogGroupName:
    Description: CloudWatch log group name.
    Value: !Ref LogGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-${ServiceName}-LogGroupName'
