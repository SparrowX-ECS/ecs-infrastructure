name: CFN Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - prod

      confirmation:
        description: Type DESTROY to confirm full environment clean-up
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ============================================================
  # Deployment Guard
  # ============================================================
  deployment-guard:
    name: Deployment Guard
    runs-on: ubuntu-latest

    outputs:
      dev-root-stack-state: ${{ steps.root-stack-state.outputs.dev }}
      prod-root-stack-state: ${{ steps.root-stack-state.outputs.prod }}
      dev-root-stack-exists: ${{ steps.stack-existence.outputs.dev }}
      prod-root-stack-exists: ${{ steps.stack-existence.outputs.prod }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Read root stack state
        id: root-stack-state
        run: |
          DEV_ROOT_STACK_STATE=$(yq -r '.RootStack.State' environments/dev/dev-parameters.yaml)
          PROD_ROOT_STACK_STATE=$(yq -r '.RootStack.State' environments/prod/prod-parameters.yaml)
          PROJECT_NAME_DEV=$(yq -r '.Project.Name' environments/dev/dev-parameters.yaml)
          PROJECT_NAME_PROD=$(yq -r '.Project.Name' environments/prod/prod-parameters.yaml)

          echo "Dev RootStack.State: $DEV_ROOT_STACK_STATE"
          echo "Prod RootStack.State: $PROD_ROOT_STACK_STATE"

          echo "PROJECT_NAME=$PROJECT_NAME_DEV" >> "$GITHUB_ENV"
          echo "PROJECT_NAME_PROD=$PROJECT_NAME_PROD" >> "$GITHUB_ENV"

          echo "dev=$DEV_ROOT_STACK_STATE" >> "$GITHUB_OUTPUT"
          echo "prod=$PROD_ROOT_STACK_STATE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check root stack existence
        id: stack-existence
        run: |
          check_stack() {
            local environment="$1"
            local project_name="$2"
            local stack_name="${project_name}-${environment}-root-stack"

            if aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --region "$AWS_REGION" \
              > /dev/null 2>&1; then
              echo "$environment=true" >> "$GITHUB_OUTPUT"
              echo "$environment: root stack exists"
            else
              echo "$environment=false" >> "$GITHUB_OUTPUT"
              echo "$environment: root stack does not exist"
            fi
          }

          check_stack dev "$PROJECT_NAME_DEV"
          check_stack prod "$PROJECT_NAME_PROD"

  # ============================================================
  # Destroy Dev
  # ============================================================
  destroy-dev:
    name: Destroy Dev
    needs:
      - deployment-guard
    if: |
      inputs.environment == 'dev' &&
      inputs.confirmation == 'DESTROY' &&
      needs.deployment-guard.outputs.dev-root-stack-state == 'disabled' &&
      needs.deployment-guard.outputs.prod-root-stack-exists == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Destroy Dev
        run: |
          set -o pipefail
          ./scripts/cfn-destroy.sh dev 2>&1 | tee cfn-destroy-dev-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation destroy — Dev'
            echo '```text'
            if [ -f cfn-destroy-dev-output.txt ]; then
              tail -n 120 cfn-destroy-dev-output.txt
            else
              echo 'The Dev destroy did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # Destroy Prod
  # ============================================================
  destroy-prod:
    name: Destroy Prod
    needs:
      - deployment-guard
    if: |
      inputs.environment == 'prod' &&
      inputs.confirmation == 'DESTROY' &&
      needs.deployment-guard.outputs.prod-root-stack-state == 'disabled' &&
      needs.deployment-guard.outputs.prod-root-stack-exists == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Destroy Prod
        run: |
          set -o pipefail
          ./scripts/cfn-destroy.sh prod 2>&1 | tee cfn-destroy-prod-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation destroy — Prod'
            echo '```text'
            if [ -f cfn-destroy-prod-output.txt ]; then
              tail -n 120 cfn-destroy-prod-output.txt
            else
              echo 'The Prod destroy did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"