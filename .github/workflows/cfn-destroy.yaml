name: CFN Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to confirm full environment clean-up
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1

jobs:
  destroy:
    name: Destroy Infrastructure
    if: github.event.inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Check configured region
        run: test "$(yq -r '.environment.region' parameters.yaml)" = "$AWS_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cloudformation-github-actions
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Destroy CloudFormation stacks
        env:
          CONFIRM_DESTROY: ${{ github.event.inputs.confirmation }}
        run: |
          set -o pipefail
          ./scripts/cfn-destroy.sh 2>&1 | tee cfn-destroy-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation destroy'
            echo '```text'
            if [ -f cfn-destroy-output.txt ]; then
              tail -n 120 cfn-destroy-output.txt
            else
              echo 'The destroy did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
