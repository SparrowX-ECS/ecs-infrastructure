name: CFN Plan

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'cloudformation/**'
      - 'environments/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLOUDFORMATION_ARTIFACT_BUCKET: ${{ vars.CLOUDFORMATION_ARTIFACT_BUCKET }}

jobs:

  # ============================================================
  # Check & Validate
  # ============================================================
  validate:
    name: Check & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Validate parameter files
        run: |
          yq eval '.' environments/dev/dev-parameters.yaml > /dev/null
          yq eval '.' environments/prod/prod-parameters.yaml > /dev/null

      - name: Validate CloudFormation syntax
        run: |
          cfn-lint \
            cloudformation/*.yaml \
            cloudformation/modules/*.yaml \
            environments/dev/dev-stack.yaml \
            environments/prod/prod-stack.yaml

  # ============================================================
  # Plan Dev
  # ============================================================
  plan-dev:
    name: Plan Dev
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Dev plan
        run: |
          set -o pipefail
          ./scripts/cfn-plan.sh dev 2>&1 | tee cfn-plan-dev-output.txt

      - name: Add Dev plan to summary
        if: always()
        run: |
          {
            echo '## CloudFormation plan — Dev'
            echo '```text'
            if [ -f cfn-plan-dev-output.txt ]; then
              sed -n '1,240p' cfn-plan-dev-output.txt
            else
              echo 'The Dev plan did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # Plan Prod
  # ============================================================
  plan-prod:
    name: Plan Prod
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Prod plan
        run: |
          set -o pipefail
          ./scripts/cfn-plan.sh prod 2>&1 | tee cfn-plan-prod-output.txt

      - name: Add Prod plan to summary
        if: always()
        run: |
          {
            echo '## CloudFormation plan — Prod'
            echo '```text'
            if [ -f cfn-plan-prod-output.txt ]; then
              sed -n '1,240p' cfn-plan-prod-output.txt
            else
              echo 'The Prod plan did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"