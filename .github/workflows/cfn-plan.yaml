name: CFN Plan

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'cloudformation/**'
      - 'parameters.yaml'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: eu-west-1

jobs:
  plan:
    name: Plan CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Check configured region
        run: test "$(yq -r '.environment.region' parameters.yaml)" = "$AWS_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cloudformation-github-actions
          aws-region: eu-west-1

      - name: Validate templates
        run: |
          cfn-lint cloudformation/*.yaml
          for template in cloudformation/*.yaml; do
            aws cloudformation validate-template \
              --template-body file://"$template"
          done

      - name: Create and inspect change sets
        run: |
          set -o pipefail
          ./scripts/cfn-plan.sh 2>&1 | tee cfn-plan-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation plan'
            echo '```text'
            if [ -f cfn-plan-output.txt ]; then
              sed -n '1,240p' cfn-plan-output.txt
            else
              echo 'The plan did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: cfn-plan-output.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cfn-plan -->';
            const plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8').slice(0, 12000)
              : 'The plan did not start; inspect the workflow logs.';
            const body = `${marker}\n## CloudFormation plan\n\n\`\`\`text\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
