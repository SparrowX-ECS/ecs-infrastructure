name: CFN Apply

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - 'environments/**'
      - 'scripts/cfn-apply.sh'
      - '.github/workflows/cfn-apply.yaml'

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLOUDFORMATION_ARTIFACT_BUCKET: ${{ vars.CLOUDFORMATION_ARTIFACT_BUCKET }}


jobs:
  # ============================================================
  # Detecting Repo Changes
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      code: ${{ steps.filter.outputs.dev }}
      deploy: ${{ steps.filter.outputs.prod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Trigger Automated Dev Deployment For Any Infrastructure Level Changes (Modules Or Dev Specific) Or Workflow Changes
      # Trigger Automated Prod Deployment For Prod Specific Changes Only
      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dev:
              - 'cloudformation/modules/**'
              - '/environments/dev/**'
              - 'scripts/cfn-apply.sh'
              - '.github/workflows/cfn-apply.yaml'
            prod:
              - '/environments/prod/**'

  # ============================================================
  # Common validation
  # ============================================================
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Validate parameter files
        run: |
          yq eval '.' environments/dev/dev-parameters.yaml > /dev/null
          yq eval '.' environments/prod/prod-parameters.yaml > /dev/null

      - name: Validate CloudFormation syntax
        run: |
          cfn-lint \
            -i W3002 W1030 \
            -- \
            cloudformation/*.yaml \
            cloudformation/modules/*.yaml \
            environments/dev/dev-stack.yaml \
            environments/prod/prod-stack.yaml


  # ============================================================
  # Development
  # ============================================================
  deploy-dev:
    name: Deploy Dev
    needs: 
      - validate
      - changes
    if: |
      needs.changes.outputs.dev == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Apply Dev CloudFormation
        run: |
          set -o pipefail
          ./scripts/cfn-apply.sh dev 2>&1 | tee cfn-apply-dev-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation apply — dev'
            echo '```text'
            if [ -f cfn-apply-dev-output.txt ]; then
              tail -n 120 cfn-apply-dev-output.txt
            else
              echo 'The dev apply did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # Production
  # ============================================================
  deploy-prod:
    name: Deploy Prod
    needs: 
      - validate
      - changes
    if: |
      needs.changes.outputs.prod == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Apply Prod CloudFormation
        run: |
          set -o pipefail
          ./scripts/cfn-apply.sh prod 2>&1 | tee cfn-apply-prod-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation apply — prod'
            echo '```text'
            if [ -f cfn-apply-prod-output.txt ]; then
              tail -n 120 cfn-apply-prod-output.txt
            else
              echo 'The prod apply did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"