name: CFN Apply

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - 'parameters.yaml'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint cloudformation/*.yaml

      - name: Validate CloudFormation templates
        run: |
          for template in cloudformation/*.yaml; do
            aws cloudformation validate-template \
              --template-body file://"$template"
          done

  apply:
    name: Apply Infrastructure
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Check configured region
        run: test "$(yq -r '.environment.region' parameters.yaml)" = "$AWS_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cloudformation-github-actions
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Apply CloudFormation stacks
        run: |
          set -o pipefail
          ./scripts/cfn-apply.sh 2>&1 | tee cfn-apply-output.txt

      - name: Add to summary
        if: always()
        run: |
          {
            echo '## CloudFormation apply'
            echo '```text'
            if [ -f cfn-apply-output.txt ]; then
              tail -n 120 cfn-apply-output.txt
            else
              echo 'The apply did not start; inspect the workflow logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
