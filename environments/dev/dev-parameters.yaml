Project:
  Name: sparrowx
  Environment: dev

RootStack:
  State: enabled

Network:
  Mode: enabled
  VpcCidr: 10.0.0.0/16

  PublicSubnets:
    A: 10.0.1.0/24
    B: 10.0.2.0/24
    C: 10.0.3.0/24

  PrivateSubnets:
    A: 10.0.4.0/24
    B: 10.0.5.0/24
    C: 10.0.6.0/24

  NatGateways:
    A: enabled
    B: enabled
    C: enabled

LoadBalancer:
  Mode: enabled
  Scheme: internet-facing

ECS:
  Mode: enabled

ECR:
  Mode: enabled
  Repositories:
    - customerapi
    - taskapi
    - billingapi
    - notificationapi
    - reportingapi
    - webportal

PostgreSQL:
  Mode: enabled
  Databases:
    - customerdb
    - taskdb
    - billingdb
    - notificationdb

  MultiAZ: false
  InstanceClass: db.t4g.micro
  AllocatedStorage: 20
  EngineVersion: "16"

CloudFront:
  Mode: enabled
  CertificateArn: /sparrowx/cloudfront/acm-certificate-arn
  DomainName: sparrowx-dev.mo2cloud.com

Observability:
  Mode: enabled
  AllowPublicAccess: enabled

Prometheus:
  Image: prom/prometheus:latest
  Cpu: 512
  Memory: 1024 
  DesiredCount: 1
  ContainerPort: 9090
  Retention: 7d

Grafana:
  Image: grafana/grafana:latest
  Cpu: 256
  Memory: 512 
  DesiredCount: 1
  ContainerPort: 3000
