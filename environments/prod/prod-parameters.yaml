Project:
  Name: sparrowx
  Environment: prod

RootStack:
  State: disabled

Network:
  Mode: enabled
  VpcCidr: 10.10.0.0/16

  PublicSubnets:
    A: 10.10.1.0/24
    B: 10.10.2.0/24
    C: 10.10.3.0/24

  PrivateSubnets:
    A: 10.10.4.0/24
    B: 10.10.5.0/24
    C: 10.10.6.0/24

  NatGateways:
    A: enabled
    B: enabled
    C: enabled

LoadBalancer:
  Mode: enabled
  Scheme: internet-facing

ECS:
  Mode: enabled

ECR:
  Mode: enabled
  Repositories:
    - customerapi
    - taskapi
    - billingapi
    - notificationapi
    - reportingapi
    - webportal

PostgreSQL:
  Mode: enabled
  Databases:
    - customerdb
    - taskdb
    - billingdb
    - notificationdb

  MultiAZ: false
  InstanceClass: db.t4g.micro
  AllocatedStorage: 20
  EngineVersion: "16"

CloudFront:
  Mode: enabled
  CertificateArn: /sparrowx/cloudfront/acm-certificate-arn
  DomainName: sparrowx-prod.mo2cloud.com